<svg viewBox="0 0 1920 480" width="1920" height="480" xmlns="http://www.w3.org/2000/svg">
<defs>
  
  <filter id="shapeShadowL" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="10" result="blur"/>
    <feOffset in="blur" dx="0" dy="8" result="off"/>
    <feFlood flood-color="#000000" flood-opacity="0.35" result="fl"/>
    <feComposite in="fl" in2="off" operator="in" result="sh"/>
    <feMerge><feMergeNode in="sh"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="shapeShadowR" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="9" result="blur"/>
    <feOffset in="blur" dx="0" dy="6" result="off"/>
    <feFlood flood-color="#000000" flood-opacity="0.25" result="fl"/>
    <feComposite in="fl" in2="off" operator="in" result="sh"/>
    <feMerge><feMergeNode in="sh"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="textShadow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
    <feOffset in="blur" dx="0" dy="4" result="off"/>
    <feFlood flood-color="#000000" flood-opacity="0.2" result="fl"/>
    <feComposite in="fl" in2="off" operator="in" result="sh"/>
    <feMerge><feMergeNode in="sh"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<g>
<rect x="0" y="0" width="1920" height="480" fill="#111318"/>
<polygon points="0,0 480.0,0 288.0,480 0,480" fill="#005faf" filter="url(#shapeShadowL)"/>
<polygon points="1920,0 1440.0,0 1632.0,480 1920,480" fill="#386595" filter="url(#shapeShadowR)"/>
<text x="960.0" y="240.0" text-anchor="middle" dominant-baseline="central" font-family='"Roboto", "Segoe UI", "Arial", sans-serif' font-weight="bold" font-size="72" letter-spacing="12" fill="#ffffff" filter="url(#textShadow)">OPEN STREAM ENVIRONMENT</text>
</g>
</svg>